# Default values for psc-pipeline.
# A weekly CronJob runs the PSC pipeline; PostgreSQL (groundhog2k subchart) stores the results.
# See REVIEW.md for why each setting is what it is.

nameOverride: ""
fullnameOverride: ""

image:
  # -- The pipeline image, built from the repository root: docker build -t psc-pipeline:0.1.0 .
  # On kind: kind load docker-image psc-pipeline:0.1.0. In a real cluster, push it to a registry and set repository.
  # Use a new tag for every build: with IfNotPresent, a node that has the tag keeps the old image.
  repository: psc-pipeline
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Weekly, Friday 06:00 UTC. Companies House publishes no fixed time, so check the date of the snapshot you load.
schedule: "0 6 * * 5"
timeZone: Etc/UTC

input:
  # -- File the pipeline reads. The default is the sample baked into the image (ADR 0014).
  path: /app/data/persons-with-significant-control-snapshot-2026-10-29-sample.txt.gz
  download:
    # -- Download a zip before each run into a scratch volume. Then set input.path to /input/<file in the zip>.
    enabled: false
    url: ""
    # -- Cap on the scratch volume. One full snapshot is about 2.4 GB zipped plus 14 GB unzipped.
    sizeLimit: 20Gi

pipeline:
  # -- true: run every check, write nothing to the database.
  dryRun: false

job:
  # -- Never run two at once: both would build psc_staging. The pipeline also takes a Postgres advisory lock,
  # which covers manual jobs (kubectl create job --from=cronjob/...) that this setting does not.
  concurrencyPolicy: Forbid
  # -- Retry only crashes or lost pods (exit 2, eviction). Exit 1 means a data check failed: retrying
  # the same input fails the same way, so the job stops at once (podFailurePolicy in cronjob.yaml).
  backoffLimit: 2
  # -- Kill a run that hangs. The sample takes seconds.
  activeDeadlineSeconds: 3600
  # -- If the controller missed the schedule (for example during an upgrade), still start up to 6 hours late.
  startingDeadlineSeconds: 21600
  # -- How long the wait for PostgreSQL (pg_isready) may take before the run fails.
  waitForDatabaseSeconds: 300
  # -- Image for the wait step and helm test: the PostgreSQL client tools. Same major version as the server.
  postgresClientImage: postgres:16.14
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

serviceAccount:
  # -- A dedicated account with no permissions and no API token: the pipeline never calls the Kubernetes API.
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- Measured: 214 MB peak on the sample. The full snapshot needs a different design (NOTES.md), not a bigger pod.
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

database:
  # -- Host of an external PostgreSQL. Empty: use the bundled one (postgres.enabled), whose Service is <release>-postgres.
  host: ""
  port: 5432
  # -- The Secret holding the credentials. It must match postgres.settings.existingSecret and
  # postgres.userDatabase.existingSecret below. Keys: POSTGRES_DB, USERDB_USER, USERDB_PASSWORD, POSTGRES_PASSWORD.
  # The name is fixed because subchart values can't be templated: one release per namespace.
  secretName: psc-db
  # -- Create that Secret. Set false to bring your own (ADR 0015).
  createSecret: true
  name: psc
  user: psc
  # -- Leave empty to generate a random password on install; it's kept across helm upgrade (lookup).
  # With GitOps tools that render with `helm template` (Argo CD), lookup sees nothing and the password would
  # change on every sync: set it here, or use createSecret: false with your own Secret.
  password: ""
  superuserPassword: ""

postgres:
  # -- Deploy PostgreSQL with this chart. Keys below are the groundhog2k chart's own, not Bitnami's.
  # Don't set postgres.fullnameOverride or nameOverride: the pipeline derives the Service name (<release>-postgres).
  enabled: true
  settings:
    existingSecret: psc-db
    superuserPassword:
      secretKey: POSTGRES_PASSWORD
  userDatabase:
    existingSecret: psc-db
    name:
      secretKey: POSTGRES_DB
    user:
      secretKey: USERDB_USER
    password:
      secretKey: USERDB_PASSWORD
  storage:
    # -- A PVC, so data and run history survive a PostgreSQL restart. Helm does not delete it on uninstall.
    requestedSize: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
