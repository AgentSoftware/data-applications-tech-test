{{- if .Values.serviceAccount.create -}}
# The pipeline reads its configuration from the cluster when it starts, so its service account needs read access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "psc-pipeline.fullname" . }}
  labels:
    {{- include "psc-pipeline.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "psc-pipeline.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
