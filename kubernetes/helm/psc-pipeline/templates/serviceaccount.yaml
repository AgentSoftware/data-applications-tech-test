{{- if .Values.serviceAccount.create -}}
# No Role or binding: the pipeline never calls the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "psc-pipeline.serviceAccountName" . }}
  labels:
    {{- include "psc-pipeline.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
