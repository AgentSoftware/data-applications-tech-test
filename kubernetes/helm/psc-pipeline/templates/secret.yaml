{{- if .Values.database.createSecret }}
{{- if and .Values.postgres.enabled (or (ne .Values.postgres.settings.existingSecret .Values.database.secretName) (ne .Values.postgres.userDatabase.existingSecret .Values.database.secretName)) }}
{{- fail "postgres.settings.existingSecret and postgres.userDatabase.existingSecret must equal database.secretName" }}
{{- end }}
{{- /* Keep generated passwords across upgrades: reuse what the live Secret holds. */}}
{{- $live := (lookup "v1" "Secret" .Release.Namespace .Values.database.secretName).data | default dict }}
{{- $password := .Values.database.password | default (index $live "USERDB_PASSWORD" | default "" | b64dec) | default (randAlphaNum 24) }}
{{- $superuser := .Values.database.superuserPassword | default (index $live "POSTGRES_PASSWORD" | default "" | b64dec) | default (randAlphaNum 24) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secretName }}
  labels:
    {{- include "psc-pipeline.labels" . | nindent 4 }}
  annotations:
    # Postgres keeps its data volume after uninstall, so keep the password that matches it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_DB: {{ .Values.database.name | b64enc }}
  USERDB_USER: {{ .Values.database.user | b64enc }}
  USERDB_PASSWORD: {{ $password | b64enc }}
  POSTGRES_PASSWORD: {{ $superuser | b64enc }}
{{- end }}
