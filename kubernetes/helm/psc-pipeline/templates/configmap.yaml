apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "psc-pipeline.fullname" . }}-config
  namespace: default
  labels:
    {{- include "psc-pipeline.labels" . | nindent 4 }}
data:
  # Settings that the pipeline reads as environment variables.
  DATABASE_URL: {{ include "psc-pipeline.databaseUrl" . | quote }}
  LOG_LEVEL: {{ .Values.pipeline.logLevel | quote }}
