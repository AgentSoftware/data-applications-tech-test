[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psc-pipeline"
version = "0.1.0"
description = "Turns the Companies House PSC snapshot into one lookup row per company"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psc_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (docker compose up -d postgres)",
    "kind: installs the chart on a local kind cluster (slow; see tests/chart/test_kind.py)",
]
addopts = "-m 'not integration and not kind'"
