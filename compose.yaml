# Local run: docker compose up -d postgres && docker compose run --rm pipeline
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: psc
      POSTGRES_PASSWORD: psc        # local only; the chart takes it from a Secret
      POSTGRES_DB: psc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psc -d psc"]
      interval: 2s
      retries: 15

  pipeline:
    build: .
    environment:
      PGHOST: postgres
      PGUSER: psc
      PGPASSWORD: psc
      PGDATABASE: psc
    depends_on:
      postgres:
        condition: service_healthy
